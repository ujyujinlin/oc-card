  /* ---------------- 圖片處理與 Base64 上傳 ---------------- */
  function triggerInitialUpload(prefix) {
    const img = document.getElementById(`${prefix}-preview`);
    if (!img.src || img.style.display === 'none') {
      triggerUpload(prefix);
    }
  }

  function triggerUpload(prefix) {
    document.getElementById(`${prefix}-input`).click();
  }

  function uploadImageBase64(input, prefix) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        setAvatarPreview(prefix, e.target.result);
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function setAvatarPreview(prefix, src) {
    const img = document.getElementById(`${prefix}-preview`);
    const text = document.getElementById(`${prefix}-text`);
    const overlay = document.getElementById(`${prefix}-overlay`);

    img.src = src;
    img.style.display = 'block';
    if (text) text.style.display = 'none';
    if (overlay) overlay.style.display = 'flex';
  }

  /* ---------------- 時間軸與重大事件系統 ---------------- */
  function jumpToTimeline(age) {
    age = parseInt(age) || 0;
    const maxVal = parseInt(document.getElementById('timelineSlider').max) || 100;
    if (age > maxVal) updateSliderMax(age);

    document.getElementById('timelineSlider').value = age;
    document.getElementById('jumpInput').value = age;
    document.getElementById('currentAgeTag').innerText = `${age} 歲時`;

    document.getElementById('timelineNote').value = timelineData[age] || '';
  }

  function updateSliderMax(val, render = true) {
    val = parseInt(val) || 100;
    document.getElementById('timelineSlider').max = val;
    document.getElementById('sliderMaxLabel').innerText = val;
    document.getElementById('maxLimitInput').value = val;
    if (render) updateMaxProgressTag();
  }

  function onNoteInput() {
    const age = document.getElementById('timelineSlider').value;
    const note = document.getElementById('timelineNote').value;
    if (note.trim() === '') {
      delete timelineData[age];
    } else {
      timelineData[age] = note;
    }
    updateMaxProgressTag();
  }

  function updateMaxProgressTag() {
    const charName = document.getElementById('field-name').value || '未命名角色';
    const ages = Object.keys(timelineData).map(Number).filter(a => timelineData[a] && timelineData[a].trim() !== '');
    const maxAge = ages.length > 0 ? Math.max(...ages) : 0;
    currentProgress = maxAge;
    document.getElementById('maxProgressTag').innerText = `記錄至 ${charName} ${maxAge} 歲時`;
  }

  function renderMajorEvents() {
    const container = document.getElementById('events-list');
    container.innerHTML = '';
    majorEvents.forEach((ev, idx) => {
      const chip = document.createElement('div');
      chip.className = 'event-chip';
      chip.innerHTML = `
        <span onclick="jumpToTimeline(${ev.age}); openEventModal(${idx});">📍 [${escapeHtml(ev.year)}] ${ev.age}歲: ${escapeHtml(ev.name)}</span>
        <button type="button" class="edit-only-btn" onclick="deleteMajorEvent(${idx})">✕</button>
      `;
      container.appendChild(chip);
    });
  }

  function openEventModal(index = -1) {
    document.getElementById('event-edit-index').value = index;
    if (index >= 0 && majorEvents[index]) {
      const ev = majorEvents[index];
      document.getElementById('event-dialog-title').innerText = "修改重大事件";
      document.getElementById('event-input-year').value = ev.year || '';
      document.getElementById('event-input-age').value = ev.age || 0;
      document.getElementById('event-input-name').value = ev.name || '';
      document.getElementById('event-input-desc').value = ev.desc || '';
    } else {
      document.getElementById('event-dialog-title').innerText = "新增重大事件";
      document.getElementById('event-input-year').value = '';
      document.getElementById('event-input-age').value = document.getElementById('timelineSlider').value;
      document.getElementById('event-input-name').value = '';
      document.getElementById('event-input-desc').value = '';
    }
    document.getElementById('eventDialogModal').style.display = 'flex';
  }

  function closeEventModal() {
    document.getElementById('eventDialogModal').style.display = 'none';
  }

  function saveEventFromModal() {
    const idx = parseInt(document.getElementById('event-edit-index').value);
    const year = document.getElementById('event-input-year').value.trim();
    const age = parseInt(document.getElementById('event-input-age').value) || 0;
    const name = document.getElementById('event-input-name').value.trim();
    const desc = document.getElementById('event-input-desc').value.trim();

    if (!name) return alert("請輸入事件名稱！");

    const eventObj = { year: year || '未知年份', age: age, name: name, desc: desc };

    if (idx >= 0 && majorEvents[idx]) {
      majorEvents[idx] = eventObj;
    } else {
      majorEvents.push(eventObj);
    }

    majorEvents.sort((a, b) => a.age - b.age);
    closeEventModal();
    renderMajorEvents();
  }

  function deleteMajorEvent(idx) {
    if (confirm("確定要刪除此重大事件嗎？")) {
      majorEvents.splice(idx, 1);
      renderMajorEvents();
    }
  }

  /* ---------------- 圖片檢視 Modal 與縮放功能 ---------------- */
  let zoomScale = 1;
  function openModalById(imgId) {
    const src = document.getElementById(imgId).src;
    if (!src) return;
    document.getElementById('modalImg').src = src;
    document.getElementById('imageModal').style.display = 'flex';
    resetZoom();
  }

  function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
  }

  function adjustZoom(delta) {
    zoomScale = Math.max(0.2, Math.min(5, zoomScale + delta));
    document.getElementById('modalImgContainer').style.transform = `scale(${zoomScale})`;
  }

  function resetZoom() {
    zoomScale = 1;
    const container = document.getElementById('modalImgContainer');
    container.style.transform = `scale(1)`;
    container.style.left = '0px';
    container.style.top = '0px';
  }

  function setupZoomAndPan() {
    const viewport = document.getElementById('modalViewport');
    const container = document.getElementById('modalImgContainer');
    let isPanning = false, startX, startY, currentX = 0, currentY = 0;

    viewport.addEventListener('mousedown', (e) => {
      isPanning = true;
      startX = e.clientX - currentX;
      startY = e.clientY - currentY;
      viewport.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      currentX = e.clientX - startX;
      currentY = e.clientY - startY;
      container.style.transform = `translate(${currentX}px, ${currentY}px) scale(${zoomScale})`;
    });

    document.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.style.cursor = 'grab';
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      adjustZoom(e.deltaY < 0 ? 0.15 : -0.15);
    }, { passive: false });
  }

  /* ---------------- JSON 匯入與匯出 ---------------- */
  function exportDataJson() {
    saveCurrentPageData(true);
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
      user: currentUser,
      appData: appData,
      accounts: accountsData,
      sharedFolders: sharedFoldersData
    }));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `OC_Backup_${currentUser}_${Date.now()}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importDataJson(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.appData) appData = imported.appData;
          if (imported.accounts) accountsData = imported.accounts;
          if (imported.sharedFolders) sharedFoldersData = imported.sharedFolders;
          saveToLocalStorage();
          saveAccountsToStorage();
          saveSharedFoldersToStorage();
          renderTree();
          updateAccountUI();
          showNotification("成功匯入 JSON 備份資料！", "success");
        } catch (err) {
          alert("JSON 檔案解析失敗！");
        }
      };
      reader.readAsText(input.files[0]);
    }
  }

  /* ---------------- 匯出 PNG / PDF 功能 ---------------- */
  async function exportToPNG() {
    showNotification("正在準備匯出 PNG 高清圖片...", "info");
    const container = document.getElementById('cardContainer');
    container.classList.add('export-readonly-mode');
    
    try {
      const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false });
      const link = document.createElement('a');
      link.download = `${document.getElementById('field-name').value || '角色卡'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showNotification("PNG 圖片匯出成功！", "success");
    } catch (err) {
      alert("匯出 PNG 失敗：" + err.message);
    } finally {
      container.classList.remove('export-readonly-mode');
    }
  }

  async function exportToPDF() {
    showNotification("正在準備匯出 PDF 文件...", "info");
    const container = document.getElementById('cardContainer');
    container.classList.add('export-readonly-mode');

    try {
      const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

      pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
      pdf.save(`${document.getElementById('field-name').value || '角色卡'}.pdf`);
      showNotification("PDF 文件匯出成功！", "success");
    } catch (err) {
      alert("匯出 PDF 失敗：" + err.message);
    } finally {
      container.classList.remove('export-readonly-mode');
    }
  }
