<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OC 角色卡雲端與重大事件管理系統 Pro Max</title>
  <style>
    /* ... (保留原有 CSS，由於篇幅限制此處不重複，請帶入原版 CSS) ... */
    /* 為事件節點編輯按鈕增加樣式 */
    .event-chip-content { cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .event-chip-content:hover { text-decoration: underline; }
  </style>
</head>
<body>
<!-- ... (保留原有 HTML 結構，包含彈窗、側邊欄、主容器等，與原版完全一致) ... -->
<!-- 下方為更新後的核心 JS 邏輯 -->

<script>
  let usersDb = {}; 
  let currentUser = null; 

  let appData = { tree: [] };
  let activePageId = "";
  let currentPageOwnerId = "";
  let timelineData = {}; 
  let majorEvents = [];
  let personalityList = [];
  let keywordsList = [];
  let currentYear = 2000;
  let uploadedFilesStore = {}; 
  let visibleCharMap = {}; 
  let currentActiveFolderForModal = null; 

  let currentH = 210, currentS = 1, currentV = 1;
  let currentZoom = 1;

  const broadcastChannel = new BroadcastChannel('oc_system_live_notifications');

  window.onload = function() {
    loadUsersDbFromStorage();
    checkSession();
    // setupZoomAndPan(); // 若有實作則保留
    initColorWheel();
    // initSidebarResizable(); // 若有實作則保留
    initLiveNotificationListener();

    document.addEventListener('click', () => {
      const pop = document.getElementById('color-popover');
      if (pop && pop.classList.contains('active')) {
        pop.classList.remove('active');
        saveColorToActivePage();
      }
    });
  };

  /* ==========================================================================
     [更新] 廣播更新與即時同步
     ========================================================================== */
  function broadcastFolderSync(folder) {
    broadcastChannel.postMessage({
      type: 'FOLDER_SYNC',
      targetFolder: folder,
      sentTime: Date.now()
    });
  }

  function initLiveNotificationListener() {
    broadcastChannel.onmessage = (event) => {
      const data = event.data;
      if (!data) return;

      const sentTime = data.sentTime || Date.now();
      const elapsedMs = Date.now() - sentTime;

      if (data.type === 'USER_JOINED') {
        showToastNotification(`🔔 即時通知：[${data.userName}] 加入了共享資料夾「${data.folderName}」`, elapsedMs);
      } else if (data.type === 'FOLDER_SYNC' && data.targetFolder) {
        // [更新] 即時更新所有參與者的資料夾與成員數量顯示
        syncSharedFolderToLocal(data.targetFolder);
      } else if (data.type === 'INVITE_RECEIVED' && currentUser && data.targetUser === currentUser.username) {
        showToastNotification(`✉️ 收到來自 [${data.senderNick}] 的共享資料夾邀請！`, elapsedMs);
        updateMailboxBadge();
      } else if (data.type === 'VOTE_CREATED') {
        if (data.targetMembers && data.targetMembers.includes(currentUser.username)) {
          showToastNotification(`🗳️ [投票通知] 共享資料夾「${data.folderName}」發起了 ${data.voteType === 'delete_member' ? '刪除成員' : '刪除資料夾'} 投票！`, elapsedMs);
          updateMailboxBadge();
        }
      } else if (data.type === 'ACCOUNT_DELETED') {
        showToastNotification(`📢 [即時通知] 用戶 [${data.userNick}] 已刪除帳號，所有共享權限已自動更動。`, elapsedMs);
        loadUsersDbFromStorage();
        if (currentUser) {
          appData = usersDb[currentUser.username].appData || { tree: [] };
          renderTree();
        }
      }
    };
  }

  function syncSharedFolderToLocal(targetFolder) {
    let existingIndex = appData.tree.findIndex(item => item.id === targetFolder.id);
    if (existingIndex !== -1) {
      appData.tree[existingIndex] = targetFolder;
    } else {
      // 確保只針對已經在本地目錄中的資料夾進行更新，不強制寫入陌生資料夾
      const existsInNested = findNodeAndParent(targetFolder.id);
      if (existsInNested && existsInNested.list) {
          existsInNested.list[existsInNested.index] = targetFolder;
      }
    }
    saveToLocalStorage();
    renderTree();
  }

  /* ... (保留原有 showToastNotification 邏輯) ... */

  /* ==========================================================================
     [更新] 信箱系統、成員變動與投票管理
     ========================================================================== */
  
  function acceptInvitation(index) {
    const invs = usersDb[currentUser.username].invitations;
    const inv = invs[index];

    let existing = appData.tree.find(f => f.id === inv.folderData.id);
    if (!existing) {
      if (!inv.folderData.members) {
        inv.folderData.members = [{ username: inv.senderUser, nickname: inv.senderNick, role: 'owner' }];
      }
      if (!inv.folderData.members.some(m => m.username === currentUser.username)) {
        inv.folderData.members.push({ username: currentUser.username, nickname: currentUser.nickname, role: 'member' });
        inv.folderData.shareCount = inv.folderData.members.length;
      }
      appData.tree.push(inv.folderData);
      
      // 更新發起人的雲端紀錄
      if (usersDb[inv.senderUser] && usersDb[inv.senderUser].appData) {
        let senderFolder = usersDb[inv.senderUser].appData.tree.find(f => f.id === inv.folderData.id);
        if (senderFolder) {
          senderFolder.members = inv.folderData.members;
          senderFolder.shareCount = inv.folderData.shareCount;
        }
      }
    }

    invs.splice(index, 1);
    saveUsersDbToStorage();
    saveToLocalStorage();
    renderTree();
    renderMailboxList();
    updateMailboxBadge();

    // 發送即時廣播，讓原創始者和其他成員立即看到人數變更
    broadcastFolderSync(inv.folderData);
    broadcastChannel.postMessage({ type: 'USER_JOINED', userName: currentUser.nickname, folderName: inv.folderName, sentTime: Date.now() });

    showToastNotification(`✅ 已成功加入共享資料夾「${inv.folderName}」！`);
  }

  function castVote(voteIndex, isAgree) {
    /* ... (保留原有投票邏輯) ... */
    // 當投票通過並且成功刪除成員時
    if (voteRecord.agreeCount >= requiredVotes) {
      if (vote.type === 'delete_member') {
        folder.members = folder.members.filter(m => m.username !== vote.targetUser);
        folder.shareCount = folder.members.length;
        showToastNotification(`🎉 投票通過！成員 [${vote.targetUserNick}] 已從「${folder.name}」中刪除。`);
        broadcastFolderSync(folder); // [更新] 同步刪除後的成員人數給所有人
      } else if (vote.type === 'delete_folder') {
        deleteNode(folder.id, true);
        showToastNotification(`🎉 投票通過！共享資料夾「${folder.name}」已徹底刪除。`);
      }
      delete folder.activeVotes[vote.voteId];
    } 
    /* ... (保留原有拒絕邏輯) ... */
  }

  function exitFromSharedFolder(folderId) {
    const res = findNodeAndParent(folderId);
    if (!res) return;
    if (!confirm("確定要退出該共享資料夾嗎？")) return;

    const folder = res.node;
    folder.members = (folder.members || []).filter(m => m.username !== currentUser.username);
    folder.shareCount = folder.members.length;

    res.list.splice(res.index, 1);
    saveToLocalStorage();
    renderTree();
    closeMembersModal();
    
    // [更新] 同步退出後的成員人數給剩餘所有人
    broadcastFolderSync(folder);
    showToastNotification(`已成功退出共享資料夾「${folder.name}」`);
  }

  /* ==========================================================================
     [更新] 共享邀請碼生成
     ========================================================================== */
  function generateInviteCode() {
    const folderName = prompt("請輸入要生成邀請碼的「共享資料夾名稱」：");
    if(!folderName) return;
    
    let targetNode = null;
    const search = (nodes) => {
      for(let n of nodes) {
        if (n.type === 'folder' && n.name === folderName) return n;
        if (n.children) { let r = search(n.children); if (r) return r; }
      }
      return null;
    };
    targetNode = search(appData.tree);

    if(targetNode) {
      if (targetNode.ownerId && targetNode.ownerId !== currentUser.username) {
         alert("只有創建者可以生成邀請碼！"); return;
      }
      targetNode.inviteCode = "OC-" + Math.floor(100000 + Math.random() * 900000);
      saveToLocalStorage();
      renderTree();
      broadcastFolderSync(targetNode);
      alert(`資料夾 [${targetNode.name}] 邀請碼已生成：${targetNode.inviteCode}`);
    } else {
      alert("找不到相應的資料夾！");
    }
  }

  function joinSharedFolderFromSidebar() {
    /* ... (保留原有邏輯，在成功推入 appData.tree 後追加廣播) ... */
    // ...
    targetFolder.shareCount = targetFolder.members.length;
    appData.tree.push(targetFolder);
    saveToLocalStorage();
    renderTree();
    document.getElementById('sidebarInviteInput').value = '';

    broadcastFolderSync(targetFolder); // [更新] 即時通知所有成員人數更新
    broadcastChannel.postMessage({ type: 'USER_JOINED', userName: currentUser.nickname, folderName: targetFolder.name, sentTime: Date.now() });

    showToastNotification(`🎉 成功加入共享資料夾「${targetFolder.name}」！`);
  }


  /* ==========================================================================
     [更新] 多帳號保存、雙向/多向互通互綁 (Switch Account)
     ========================================================================== */
  function addNewAccountToSavedList() {
    const u = document.getElementById('addAccUsername').value.trim();
    const p = document.getElementById('addAccPassword').value.trim();

    if (!u || !p) { alert("請填寫完整的帳號與密碼！"); return; }
    if (!usersDb[u] || usersDb[u].password !== p) {
      alert("帳號或密碼驗證錯誤，無法儲存無效的憑證！"); return;
    }

    // 將自身帳號、目標帳號、以及雙方原本就保存的帳號整合進同一個 Pool
    let pool = new Set([currentUser.username, u]);
    if (usersDb[currentUser.username].savedAccounts) {
      usersDb[currentUser.username].savedAccounts.forEach(a => pool.add(a.username));
    }
    if (usersDb[u].savedAccounts) {
      usersDb[u].savedAccounts.forEach(a => pool.add(a.username));
    }

    let poolArray = Array.from(pool);

    // 更新 Pool 內所有使用者的 savedAccounts，達到彼此互通 (A存B, B存A, 若有C則同步共享)
    poolArray.forEach(username => {
      if (usersDb[username]) {
         usersDb[username].savedAccounts = poolArray
           .filter(target => target !== username)
           .map(target => ({
             username: target,
             password: usersDb[target].password,
             nickname: usersDb[target].nickname
           }));
      }
    });

    saveUsersDbToStorage();
    document.getElementById('addAccUsername').value = '';
    document.getElementById('addAccPassword').value = '';
    renderSavedAccountsList();
    showToastNotification(`✅ 已成功建立並同步跨帳號關聯憑證（共覆蓋 ${poolArray.length} 個互通帳號）！`);
  }


  /* ==========================================================================
     [更新] 重大事件節點跨資料頁同步與【編輯功能】
     ========================================================================== */
  function renderEventsList() {
    const list = document.getElementById('events-list');
    if(!list) return;
    list.innerHTML = '';
    
    majorEvents.forEach(evt => {
      const chip = document.createElement('div');
      chip.className = 'event-chip';
      chip.style.backgroundColor = '#3498db';
      
      // 點擊事件文字區域即可進行編輯
      chip.innerHTML = `
        <span class="event-chip-content" onclick="editEvent('${evt.id}')" title="點擊快捷編輯內容、年份、年齡、敘述">
          📅 ${evt.year} - ${evt.title} ${evt.age ? `(年齡: ${evt.age})` : ''} 
          ${evt.description ? `💡` : ''}
        </span>
        <button type="button" class="edit-only-btn" onclick="removeEvent('${evt.id}')">✕</button>
      `;
      list.appendChild(chip);
    });
  }

  function editEvent(evtId) {
    const evt = majorEvents.find(e => e.id === evtId);
    if (!evt) return;
    
    const newTitle = prompt("修改事件標題：", evt.title);
    if (newTitle === null) return;
    
    const newYear = prompt("修改發生年份：", evt.year);
    if (newYear === null || isNaN(parseInt(newYear))) return;
    
    const newAge = prompt("修改當時年齡：", evt.age || "");
    if (newAge === null) return;

    const newDesc = prompt("修改事件敘述：", evt.description || "");
    if (newDesc === null) return;

    evt.title = newTitle;
    evt.year = parseInt(newYear);
    evt.age = newAge;
    evt.description = newDesc;
    
    if (typeof renderTimelineTrack === 'function') renderTimelineTrack();
    renderEventsList();
    autoSaveDraft();
    syncMajorEventsToSharedUsers();
    showToastNotification(`✅ 已成功更新事件節點「${evt.title}」`);
  }

  /* ==========================================================================
     [更新] 刪除帳號與憑證同步鎖定機制
     ========================================================================== */
  function performAccountDeletion(username) {
    const nick = usersDb[username].nickname;

    for (let u in usersDb) {
      // 1. 自所有樹狀結構中移除參與權限
      if (usersDb[u].appData && usersDb[u].appData.tree) {
        removeUserFromTreeMembers(usersDb[u].appData.tree, username);
      }
      // 2. [更新] 同步自所有互通帳號中刪除該帳號的登入憑證
      if (usersDb[u].savedAccounts) {
        usersDb[u].savedAccounts = usersDb[u].savedAccounts.filter(acc => acc.username !== username);
      }
    }

    delete usersDb[username];
    saveUsersDbToStorage();

    broadcastChannel.postMessage({ type: 'ACCOUNT_DELETED', userNick: nick, sentTime: Date.now() });
    alert("帳號與相關登入憑證已成功刪除。即將返回登入畫面。");
    handleLogout();
  }


  /* ==========================================================================
     [更新] 樹狀資料夾結構與 UI 邏輯 (包含邀請碼顯示)
     ========================================================================== */
  function renderNodes(nodes, container) {
    nodes.forEach((node) => {
      const item = document.createElement('div');
      item.className = 'tree-item';
      
      if (node.type === 'folder') {
        const shareCount = node.members ? node.members.length : 1;
        // [更新] 在標題右側顯示邀請碼
        const inviteCodeHtml = node.inviteCode ? `<span style="color:#f1c40f; font-size: 0.85em; margin-left: 8px;">(邀請碼: ${node.inviteCode})</span>` : '';
        
        item.innerHTML = `
          <div class="item-header" onclick="toggleFolder('${node.id}')">
            <span class="toggle-icon">${node.collapsed ? '▶' : '▼'}</span>
            <span class="item-title">📁 ${node.name} ${inviteCodeHtml}</span>
            <span class="share-member-count" onclick="event.stopPropagation(); openMembersModal('${node.id}')">👥 ${shareCount}人</span>
            <div class="item-btns">
              <button onclick="event.stopPropagation(); promptAddPage('${node.id}')">+頁</button>
              <button onclick="event.stopPropagation(); promptAddSubFolder('${node.id}')">+夾</button>
              <button onclick="event.stopPropagation(); initiateDeleteFolder('${node.id}')">🗑️</button>
            </div>
          </div>
          <div class="sub-tree ${node.collapsed ? 'collapsed' : ''}" id="sub-${node.id}"></div>
        `;
        container.appendChild(item);
        const subContainer = item.querySelector(`#sub-${node.id}`);
        if (node.children) renderNodes(node.children, subContainer);
      } else {
        item.className = `page-node ${activePageId === node.id ? 'active' : ''}`;
        item.innerHTML = `
          <div class="item-header" onclick="loadPage('${node.id}')">
            <span class="color-dot" style="background-color:${node.color || '#007bff'}"></span>
            <span class="item-title">📄 ${node.name}</span>
            <div class="item-btns">
              <button onclick="event.stopPropagation(); deleteNode('${node.id}')">🗑️</button>
            </div>
          </div>
        `;
        container.appendChild(item);
      }
    });
  }

  /* ==========================================================================
     圖片上傳與 Modal 檢視器 (補齊結尾)
     ========================================================================== */
  function adjustZoom(delta) { 
    currentZoom = Math.max(0.2, currentZoom + delta);
    const imgCont = document.getElementById('modalImgContainer');
    if (imgCont) imgCont.style.transform = `scale(${currentZoom})`;
  }
  
  function resetZoom() { 
    currentZoom = 1; 
    const imgCont = document.getElementById('modalImgContainer');
    if (imgCont) imgCont.style.transform = `scale(${currentZoom})`;
  }

  function toggleSidebar() { 
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.toggle('closed');
  }
</script>
</body>
</html>
